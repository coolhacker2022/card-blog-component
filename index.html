<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./assets/css/variables.css">
  <link rel="stylesheet" href="./assets/css/styles.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <title>Frontend Mentor | Blog preview card</title>

</head>
<body>
  <main>
    <article class="card">
      <img class="card__image" src="./assets/images/illustration-article.svg" alt="Article preview image">
      <header class="card__main">
        <span class="card__badge">Learning</span>
        <time class="card__date" datetime="2023-12-21">Published 21 Dec 2023</time>
        <h2><a href="#" class="card__header">HTML & CSS foundations</a></h2>
        <p class="card__description">These languages are the backbone of every website, defining structure, content, and presentation.</p>    
      </header>
      <footer class="card__footer">
        <img class="card__avatar" src="./assets/images/image-avatar.webp" alt="Photo of Greg Hooper">
        <p class="card__author-name">Greg Hooper</p>
      </footer>
    </article>
  </main>
</body>
</html>
